{% extends "base.html" %}

{% block titulo %}Mi perfil{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card shadow-sm">
            <div class="card-header">Mi perfil ({{ user.username }})</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% include "includes/campos_form.html" %}
                    <button type="submit" class="btn btn-primary">Guardar cambios</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
