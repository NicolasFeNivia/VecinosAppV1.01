{% extends "base.html" %}

{% block titulo %}Iniciar sesión{% endblock %}

{% block contenido %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header">Iniciar sesión</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {% include "includes/campos_form.html" %}
                    <button type="submit" class="btn btn-primary">Entrar</button>
                    <a class="btn btn-link" href="{% url 'registro' %}">Crear cuenta</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
